databases:
  - name: hudumaconnect-db
    plan: free
    databaseName: hudumaconnect
    user: hudumaconnect

services:
  - type: web
    name: hudumaconnect
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hudumaconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://hudumaconnect.onrender.com"
